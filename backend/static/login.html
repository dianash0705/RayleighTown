<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RayleighTown</title>

  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-brand">
      <span class="title-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21.6484 18.9639C21.6627 18.9989 21.679 19.0325 21.6973 19.0645C19.5149 22.055 15.9857 24 12 24C7.82338 24 4.14731 21.8648 1.99805 18.6279L6.13184 11.6084L9.34082 16.9199C9.57406 17.3056 10.0626 17.4512 10.4688 17.2559L13.1914 15.9463C13.3885 15.8515 13.5437 15.6864 13.625 15.4834L16.9043 7.2832L21.6484 18.9639ZM12 0C18.6274 0 24 5.37258 24 12C24 13.8948 23.5585 15.6859 22.7764 17.2793L17.709 4.80273L17.6445 4.6748C17.3097 4.11638 16.4812 4.11836 16.1494 4.67871L16.0859 4.80664L12.1816 14.5684L10.3994 15.4258L6.87207 9.58691L6.80176 9.4873C6.45266 9.05401 5.78147 9.05761 5.4375 9.49512L5.36914 9.5957L1.05566 16.9189C0.379757 15.4174 0 13.7535 0 12C0 5.37258 5.37258 0 12 0Z" fill="url(#av-logo-gradient-login)"/>
          <defs>
            <linearGradient id="av-logo-gradient-login" x1="12" y1="0" x2="12" y2="24" gradientUnits="userSpaceOnUse">
              <stop stop-color="#D71C1B"/>
              <stop offset="1" stop-color="#4A0F08"/>
            </linearGradient>
          </defs>
        </svg>
      </span>
      <div>
        <h1>RayleighTown</h1>
        <p class="auth-tagline">Periodic threat detection for your endpoints.</p>
      </div>
    </div>

    <div class="auth-toggle" role="tablist">
      <button type="button" class="auth-toggle-btn is-active" id="showLogin" role="tab" aria-selected="true">Sign in</button>
      <button type="button" class="auth-toggle-btn" id="showRegister" role="tab" aria-selected="false">Create organization</button>
    </div>

    <form id="loginForm" class="auth-form">
      <label>Organization
        <input id="loginOrg" autocomplete="organization" placeholder="Acme Security" list="recentOrgsList" required />
      </label>
      <label>Username
        <input id="loginUser" autocomplete="username" placeholder="your username" required />
      </label>
      <label>Password
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" required />
      </label>
      <button type="submit">Sign in</button>
    </form>

    <form id="registerForm" class="auth-form" hidden>
      <p class="auth-hint">Creates the org and its first admin.</p>
      <label>Organization name
        <input id="registerOrg" autocomplete="organization" placeholder="Acme Security" list="recentOrgsList" required />
      </label>
      <label>Admin username
        <input id="registerUser" autocomplete="username" placeholder="admin" required />
      </label>
      <label>Admin password
        <input id="registerPassword" type="password" autocomplete="new-password" placeholder="choose a strong password" required />
      </label>
      <button type="submit">Create organization</button>
    </form>

    <div id="authStatus" class="auth-status" role="alert"></div>
  </div>

  <datalist id="recentOrgsList"></datalist>

  <script src="login.js"></script>
</body>
</html>
