              <span class="av-filter-input-icon" aria-hidden="true"><svg viewBox="0 0 11 6" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.5 0.5C0.5 0.5 4.18 5.5 5.5 5.5C6.82 5.5 10.5 0.5 10.5 0.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            </span>
          </label>

          <label class="av-filter-field">
            <span class="av-filter-label">Event ID</span>
            <span class="av-filter-input-wrap">
              <input id="nativeEventID" class="av-filter-input" type="number" min="0" placeholder="Any" />
              <span class="av-filter-input-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12.6786 5.19061L9.18933 8.67985C8.49246 9.37672 8.14402 9.72516 7.71942 9.96242C7.29482 10.1997 6.29222 10.4384 5.3335 10.6667C5.56176 9.70794 5.80048 8.70534 6.03774 8.28074C6.27501 7.85614 6.62345 7.5077 7.32031 6.81084L10.8096 3.32159L11.7441 2.38709C12.2602 1.87097 13.097 1.87097 13.6131 2.38709C14.1292 2.9032 14.1292 3.73999 13.6131 4.2561L12.6786 5.19061ZM10.8096 3.32159L12.6786 5.19061" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 8C14 10.8284 14 12.2426 13.1213 13.1213C12.2426 14 10.8284 14 8 14C5.17157 14 3.75736 14 2.87868 13.1213C2 12.2426 2 10.8284 2 8C2 5.17157 2 3.75736 2.87868 2.87868C3.75736 2 5.17157 2 8 2" stroke="currentColor" stroke-linecap="round"/></svg></span>
            </span>
          </label>

          <label class="av-filter-field">
            <span class="av-filter-label">Min Confidence</span>
            <span class="av-filter-input-wrap">
              <input id="minConfidence" class="av-filter-input" type="number" min="0" max="100" placeholder="Any" />
              <span class="av-filter-input-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12.6786 5.19061L9.18933 8.67985C8.49246 9.37672 8.14402 9.72516 7.71942 9.96242C7.29482 10.1997 6.29222 10.4384 5.3335 10.6667C5.56176 9.70794 5.80048 8.70534 6.03774 8.28074C6.27501 7.85614 6.62345 7.5077 7.32031 6.81084L10.8096 3.32159L11.7441 2.38709C12.2602 1.87097 13.097 1.87097 13.6131 2.38709C14.1292 2.9032 14.1292 3.73999 13.6131 4.2561L12.6786 5.19061ZM10.8096 3.32159L12.6786 5.19061" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 8C14 10.8284 14 12.2426 13.1213 13.1213C12.2426 14 10.8284 14 8 14C5.17157 14 3.75736 14 2.87868 13.1213C2 12.2426 2 10.8284 2 8C2 5.17157 2 3.75736 2.87868 2.87868C3.75736 2 5.17157 2 8 2" stroke="currentColor" stroke-linecap="round"/></svg></span>
            </span>
          </label>
        </div>

        <div class="av-filter-rules">
          <div class="av-filter-rules-header">
            <h3>Filter Rules</h3>
          </div>
          <div id="filterRulesList" class="av-filter-rules-list"></div>
          <button type="button" id="addFilterRule" class="av-add-rule">
            <svg viewBox="0 0 13 13" width="13" height="13" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Add Rule
          </button>
        </div>

        <div class="av-filter-actions">
          <button type="button" id="resetFilters" class="av-reset-link">Reset</button>
          <button type="submit" class="av-apply-btn">Apply Filters</button>
        </div>
      </form>

      <div id="status" class="av-status"></div>

      <div class="av-list-shell">
        <div class="av-list-scroll">
          <div class="av-list-header" role="row">
            <button type="button" class="av-col av-col-event sortable" data-sort-key="eventName"><span>Event</span><span class="av-sort-indicator"></span></button>
            <button type="button" class="av-col av-col-confidence sortable" data-sort-key="confidence"><span>Confidence</span><span class="av-sort-indicator"></span></button>
            <button type="button" class="av-col av-col-endpoint sortable" data-sort-key="endpointID"><span>Endpoint</span><span class="av-sort-indicator"></span></button>
            <button type="button" class="av-col av-col-period sortable" data-sort-key="periodTs"><span>Period</span><span class="av-sort-indicator"></span></button>
            <button type="button" class="av-col av-col-start sortable" data-sort-key="tsBegin"><span>Start time</span><span class="av-sort-indicator"></span></button>
            <button type="button" class="av-col av-col-end sortable" data-sort-key="tsEnd"><span>End time</span><span class="av-sort-indicator"></span></button>
            <button type="button" class="av-col av-col-id sortable" data-sort-key="alertID"><span>Alert ID</span><span class="av-sort-indicator"></span></button>
          </div>
          <div class="av-list" id="alertsList" hidden role="rowgroup"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script src="time_range.js"></script>
  <script src="relative_time.js"></script>
  <script src="script.js"></script>
</body>
