<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RayleighTown Alerts Viewer</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title-block">
        <div class="title-line">
          <span class="title-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.3 6.8 3.8L12 12 5.2 8.1 12 4.3zM5 9.9l6 3.3v6.6L5 16.4V9.9zm14 0v6.5l-6 3.4v-6.6l6-3.3z"/></svg>
          </span>
          <h2>RayleighTown Alerts Viewer</h2>
        </div>
        <p class="subtitle">Triage periodic alert groups across endpoints. Filter by any signal, sort by confidence, and inspect contributing events.</p>
      </div>

      <div class="header-tools">
        <div class="time-range" id="timeRange">
          <button type="button" class="time-range-toggle" id="timeRangeToggle" aria-haspopup="true" aria-expanded="false">
            <svg class="time-range-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V3zm1 4h-2v6l5 3 1-1.7-4-2.3V7z"/></svg>
            <span class="time-range-current" id="timeRangeLabel">All time</span>
            <svg class="time-range-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
          </button>
          <div class="time-range-popover" id="timeRangePopover" role="menu" hidden>
            <button type="button" class="time-range-preset" data-preset="last_24h" role="menuitem">Last 24 hours</button>
            <button type="button" class="time-range-preset" data-preset="last_week" role="menuitem">Last week</button>
            <button type="button" class="time-range-preset is-active" data-preset="all" role="menuitem">All time</button>
            <button type="button" class="time-range-preset" data-preset="custom" role="menuitem">Custom range</button>
            <div class="time-range-custom" id="timeRangeCustom" hidden>
              <label>From<input id="timeFrom" type="datetime-local" lang="en-GB" /></label>
              <label>To<input id="timeTo" type="datetime-local" lang="en-GB" /></label>
              <button type="button" id="applyTimeRange" class="secondary-button">Apply</button>
            </div>
          </div>
        </div>
        <nav class="page-nav" aria-label="Main navigation">
          <a class="nav-link" href="/">Dashboard</a>
          <a class="nav-link is-active" href="/alerts" aria-current="page">Alerts</a>
          <a class="nav-link" href="/entities">Entities</a>
        </nav>
      </div>
    </div>

    <div class="alerts-controls">
      <div class="chip-row" id="summaryRow" hidden>
        <div class="chip"><span class="chip-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2 3 6v6c0 5 3.4 9.7 9 10 5.6-.3 9-5 9-10V6l-9-4zm0 3.2 5 2.2V12c0 3.8-2.3 7.2-5 7.9-2.7-.7-5-4.1-5-7.9V7.4l5-2.2z"/></svg></span><span>Alerts</span> <strong id="chipAlertCount">0</strong></div>
        <div class="chip"><span class="chip-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 3 6 3.3V15l-6 3.3L6 15V8.3L12 5z"/></svg></span><span>High confidence</span> <strong id="chipHighConfidenceCount">0</strong></div>
        <div class="chip"><span class="chip-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V3zm1 4h-2v6l5 3 1-1.7-4-2.3V7z"/></svg></span><span>Periods</span> <strong id="chipPeriodCount">0</strong></div>
        <div class="chip"><span class="chip-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3h10v4h4v14H3V3h4zm2 2v2h6V5H9zm-4 4v10h14V9H5zm2 2h2v2H7v-2zm4 0h6v2h-6v-2zm-4 4h10v2H7v-2z"/></svg></span><span>Endpoints</span> <strong id="chipEndpointCount">0</strong></div>
      </div>

      <button type="button" id="toggleFilters" class="filter-toggle" aria-expanded="false" aria-controls="queryForm">
        <span class="filter-toggle-label">Show filters</span>
        <span class="filter-toggle-chevron" aria-hidden="true">▸</span>
      </button>
    </div>

    <div class="active-filter-chips" id="activeFilterChips" hidden></div>

    <form id="queryForm" class="filter-panel" hidden>
      <div class="filter-grid">
        <label>
          Endpoint ID
          <input id="endpointID" placeholder="Any" />
        </label>

        <label>
          Event
          <select id="eventName">
            <option value="">Any</option>
          </select>
        </label>

        <label>
          Event ID
          <input id="nativeEventID" type="number" min="0" placeholder="Any" />
        </label>

        <label>
          Min confidence
          <input id="minConfidence" type="number" min="0" max="100" placeholder="Any" />
        </label>
      </div>

      <div class="filter-rules-shell">
        <div class="filter-rules-header">
          <h3>Filter rules</h3>
          <button type="button" id="addFilterRule" class="secondary-button">Add rule</button>
        </div>
        <div id="filterRulesList" class="filter-rules-list"></div>
      </div>

      <div class="filter-actions">
        <button type="submit">Apply Filters</button>
        <button type="button" id="resetFilters" class="secondary-button">Reset</button>
      </div>
    </form>

    <div id="status"></div>

    <div class="table-shell">
      <div class="table-scroll">
        <table id="alertsTable" hidden>
          <colgroup>
            <col class="col-confidence" />
            <col class="col-event" />
            <col class="col-endpoint" />
            <col class="col-period" />
            <col class="col-start" />
            <col class="col-end" />
            <col class="col-alert-id" />
          </colgroup>
          <thead>
            <tr>
              <th class="sortable" data-sort-key="confidence"><button type="button">Confidence <span class="sort-indicator">▼</span></button></th>
              <th class="sortable" data-sort-key="eventName"><button type="button">Event <span class="sort-indicator"></span></button></th>
              <th class="sortable" data-sort-key="endpointID"><button type="button">Endpoint <span class="sort-indicator"></span></button></th>
              <th class="sortable" data-sort-key="periodTs"><button type="button">Period <span class="sort-indicator"></span></button></th>
              <th class="sortable" data-sort-key="tsBegin"><button type="button">Start Time <span class="sort-indicator"></span></button></th>
              <th class="sortable" data-sort-key="tsEnd"><button type="button">End Time <span class="sort-indicator"></span></button></th>
              <th class="sortable" data-sort-key="alertID"><button type="button">Alert ID <span class="sort-indicator"></span></button></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script src="time_range.js"></script>
  <script src="relative_time.js"></script>
  <script src="script.js"></script>
</body>
</html>
