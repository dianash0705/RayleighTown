<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RayleighTown Alerts Viewer (POC)</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* User Custom Color Palette */
      --bg-color: #d8c4bd;           /* Background */
      --container-bg: #f0eae1;       /* Big table/container */
      --btn-ombre: linear-gradient(135deg, #f07473 0%, #BF4342 100%); /* Clearer ombre into BF4342 */
      --btn-hover: #9e3635;
      --icon-color: #70110abd;         /* Icons */
      --chip-bg: #BF4342;            /* Top Chips Background */
      --table-bg: #E7D7C1;           /* Alerts Table */
      --period-bg: #A78A7F;          /* Periods in table */
      --confidence-bg: #735751;      /* Confidence in table */
      --window-counter: #BF4342;     /* Windows counter in table */

      /* Supporting Colors for Text and Borders */
      --text-main: #2b1f1d;          
      --text-muted: #4f3b37;         
      --text-light: #ffffff;
      --border: rgba(115, 87, 81, 0.2);
      --shadow: 0 24px 80px -28px rgba(0, 0, 0, 0.4);
    }

    body { 
      font-family: 'Inter', sans-serif; 
      margin: 0; 
      padding: 32px 20px 48px;
      background: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: var(--container-bg);
      width: 100%;
      max-width: 1280px;
      padding: 28px 28px 24px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      height: fit-content;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .title-line {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title-icon,
    .chip-icon,
    .window-icon,
    .button-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      color: var(--icon-color);
    }

    .title-icon svg,
    .chip-icon svg,
    .window-icon svg,
    .button-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .title-block {
      display: grid;
      gap: 6px;
    }

    h2 {
      margin: 0;
      color: var(--text-main);
      font-weight: 700;
      font-size: 1.9rem;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 64ch;
    }

    form { 
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      flex-wrap: wrap;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.6);
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--icon-color);
      box-shadow: 0 0 0 3px rgba(140, 28, 19, 0.12);
      background: #ffffff;
    }

    button {
      background: var(--btn-ombre);
      color: var(--text-light);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 12px -4px rgba(0, 0, 0, 0.2);
    }

    button:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
      box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.25);
    }

    button:active {
      transform: translateY(0);
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 16px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--chip-bg);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: var(--text-light);
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .chip strong {
      color: var(--text-light);
      font-weight: 800;
      font-size: 1rem;
    }

    /* Target the specific Event Count to stay black 
    #chipEventCount {
      color: #000000;
    }*/

    #status {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 14px;
      min-height: 20px;
    }

    .table-shell {
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      background: var(--table-bg);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table { 
      border-collapse: collapse; 
      width: 100%;
      min-width: 1200px; 
      font-size: 0.95rem;
      table-layout: fixed;
    }

    col.col-alert-id { width: 86px; }
    col.col-event-id { width: 96px; }
    col.col-endpoint { width: 96px; }
    col.col-start { width: 242px; }
    col.col-end { width: 242px; }
    col.col-period { width: 176px; }
    col.col-confidence { width: 112px; }
    col.col-windows { width: auto; }

    th, td { 
      padding: 14px 16px; 
      text-align: left; 
      border-bottom: 1px solid rgba(115, 87, 81, 0.1); 
      vertical-align: top;
    }

    th { 
      background: rgba(255, 255, 255, 0.25); 
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    th.sortable {
      padding: 0;
    }

    th.sortable button {
      width: 100%;
      padding: 14px 16px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 700;
      text-transform: inherit;
      letter-spacing: inherit;
      cursor: pointer;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    th.sortable button:hover {
      background: rgba(115, 87, 81, 0.08);
      transform: none;
      box-shadow: none;
    }

    .sort-indicator {
      font-size: 0.75rem;
      color: var(--icon-color);
      min-width: 1em;
      text-align: right;
    }

    th:first-child { border-top-left-radius: 8px; }
    th:last-child { border-top-right-radius: 8px; }

    tbody tr {
      transition: background-color 0.15s ease;
    }
    
    tbody tr:hover {
      background-color: rgba(115, 87, 81, 0.08);
    }

    tbody td {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    tbody td:last-child {
      white-space: normal;
      overflow: visible;
    }

    tbody td:nth-child(1),
    tbody td:nth-child(2),
    tbody td:nth-child(3),
    tbody td:nth-child(7) {
      text-align: center;
    }

    tbody td:nth-child(4),
    tbody td:nth-child(5),
    tbody td:nth-child(6) {
      font-variant-numeric: tabular-nums;
    }

    tbody td:nth-child(6) {
      overflow: visible;
      text-overflow: clip;
      white-space: normal;
      min-width: 166px;
    }

    tbody td:nth-child(7) {
      overflow: visible;
      text-overflow: clip;
      white-space: normal;
    }

    .confidence-badge,
    .period-badge,
    .window-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .confidence-badge {
      background: var(--confidence-bg);
      color: var(--text-light);
    }
    
    .confidence-badge .window-icon { color: var(--text-light); }

    .period-badge {
      background: var(--period-bg);
      color: var(--text-light);
    }
    
    .period-badge .window-icon { color: var(--text-light); }

    .window-pill {
      background: var(--window-counter);
      color: var(--text-light);
      border: 1px solid rgba(0,0,0,0.1);
    }

    .window-list {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .window-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.4);
      padding: 10px 12px;
      display: grid;
      gap: 6px;
      box-shadow: 0 4px 8px -4px rgba(0, 0, 0, 0.05);
    }

    .window-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .window-card-title {
      font-weight: 700;
      color: var(--text-main);
    }

    .window-card-meta {
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .window-card-body {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .window-card .time-range {
      font-family: inherit;
      font-size: 0.88rem;
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(115, 87, 81, 0.1);
      border: 1px solid rgba(115, 87, 81, 0.15);
      word-break: break-word;
    }

    details {
      display: block;
    }

    summary {
      cursor: pointer;
      color: var(--icon-color);
      font-weight: 600;
      list-style: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    details ul {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .summary-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .summary-chevron {
      font-size: 0.75rem;
      color: var(--icon-color);
      transition: transform 0.18s ease;
    }

    details[open] .summary-chevron {
      transform: rotate(90deg);
    }

    .summary-hint {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .title-icon svg,
    .chip-icon svg,
    .window-icon svg,
    .button-icon svg {
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
    }

    @media (max-width: 900px) {
      body {
        padding: 16px;
      }

      .container {
        padding: 20px 16px 16px;
        border-radius: 18px;
      }

      h2 {
        font-size: 1.5rem;
      }

      .subtitle {
        font-size: 0.9rem;
      }

      form {
        width: 100%;
      }

      input {
        min-width: min(100%, 240px);
      }

      button {
        width: 100%;
      }

      .chip-row {
        gap: 8px;
      }

      .window-card-header {
        align-items: start;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title-block">
        <div class="title-line">
          <span class="title-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.3 6.8 3.8L12 12 5.2 8.1 12 4.3zM5 9.9l6 3.3v6.6L5 16.4V9.9zm14 0v6.5l-6 3.4v-6.6l6-3.3z"/></svg>
          </span>
          <h2>RayleighTown Alerts Viewer</h2>
        </div>
        <p class="subtitle">Explore deduped alert groups, inspect their contributing windows, and sort by any major signal to follow the strongest periodic activity.</p>
      </div>

      <form id="queryForm">
        <label>
          Endpoint ID:
          <input id="endpointID" value="123" placeholder="e.g. 123" required />
        </label>
        <button type="submit">Load Alerts</button>
      </form>
    </div>

    <div class="chip-row" id="summaryRow" hidden>
      <div class="chip"><span class="chip-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2 3 6v6c0 5 3.4 9.7 9 10 5.6-.3 9-5 9-10V6l-9-4zm0 3.2 5 2.2V12c0 3.8-2.3 7.2-5 7.9-2.7-.7-5-4.1-5-7.9V7.4l5-2.2z"/></svg></span><span>Alerts</span> <strong id="chipAlertCount">0</strong></div>
      <div class="chip"><span class="chip-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 4h18v2H3V4zm2 4h14v12H5V8zm2 2v8h10v-8H7zm2 2h6v2H9v-2z"/></svg></span><span>Windows</span> <strong id="chipWindowCount">0</strong></div>
      <div class="chip"><span class="chip-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V3zm1 4h-2v6l5 3 1-1.7-4-2.3V7z"/></svg></span><span>Periods</span> <strong id="chipPeriodCount">0</strong></div>
      <div class="chip"><span class="chip-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3h10v4h4v14H3V3h4zm2 2v2h6V5H9zm-4 4v10h14V9H5zm2 2h2v2H7v-2zm4 0h6v2h-6v-2zm-4 4h10v2H7v-2z"/></svg></span><span>Event IDs</span> <strong id="chipEventCount">0</strong></div>
    </div>

    <div id="status"></div>

    <div class="table-shell">
      <div class="table-scroll">
        <table id="alertsTable" hidden>
          <colgroup>
            <col class="col-alert-id" />
            <col class="col-event-id" />
            <col class="col-endpoint" />
            <col class="col-start" />
            <col class="col-end" />
            <col class="col-period" />
            <col class="col-confidence" />
            <col class="col-windows" />
          </colgroup>
          <thead>
            <tr>
              <th class="sortable" data-sort-key="alertID"><button type="button">Alert ID <span class="sort-indicator"></span></button></th>
              <th class="sortable" data-sort-key="nativeEventID"><button type="button">Event ID <span class="sort-indicator"></span></button></th>
              <th class="sortable" data-sort-key="endpointID"><button type="button">Endpoint <span class="sort-indicator"></span></button></th>
              <th class="sortable" data-sort-key="tsBegin"><button type="button">Start Time <span class="sort-indicator"></span></button></th>
              <th class="sortable" data-sort-key="tsEnd"><button type="button">End Time <span class="sort-indicator"></span></button></th>
              <th class="sortable" data-sort-key="periodTs"><button type="button">Period <span class="sort-indicator"></span></button></th>
              <th class="sortable" data-sort-key="confidence"><button type="button">Confidence <span class="sort-indicator"></span></button></th>
              <th>Windows</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("queryForm");
    const endpointInput = document.getElementById("endpointID");
    const statusEl = document.getElementById("status");
    const summaryRow = document.getElementById("summaryRow");
    const chipAlertCount = document.getElementById("chipAlertCount");
    const chipWindowCount = document.getElementById("chipWindowCount");
    const chipPeriodCount = document.getElementById("chipPeriodCount");
    const chipEventCount = document.getElementById("chipEventCount");
    const table = document.getElementById("alertsTable");
    const tbody = table.querySelector("tbody");
    const sortableHeaders = Array.from(table.querySelectorAll("th.sortable"));

    let currentAlerts = [];
    let sortState = {
      key: "tsBegin",
      direction: "asc",
    };

    function getSortValue(alert, key) {
      const value = alert[key];
      if (value === null || value === undefined || value === "") {
        return key === "nativeEventID" ? Number.MAX_SAFE_INTEGER : "";
      }

      if (key === "endpointID") {
        return String(value).toLowerCase();
      }

      const number = Number(value);
      if (Number.isFinite(number)) {
        return number;
      }

      return String(value).toLowerCase();
    }

    function compareAlerts(left, right) {
      const leftValue = getSortValue(left, sortState.key);
      const rightValue = getSortValue(right, sortState.key);

      if (leftValue < rightValue) {
        return sortState.direction === "asc" ? -1 : 1;
      }

      if (leftValue > rightValue) {
        return sortState.direction === "asc" ? 1 : -1;
      }

      return 0;
    }

    function updateSortIndicators() {
      for (const header of sortableHeaders) {
        const indicator = header.querySelector(".sort-indicator");
        const key = header.dataset.sortKey;
        if (!indicator) {
          continue;
        }

        if (key === sortState.key) {
          indicator.textContent = sortState.direction === "asc" ? "▲" : "▼";
        } else {
          indicator.textContent = "";
        }
      }
    }

    function sortAndRenderAlerts() {
      const sortedAlerts = [...currentAlerts].sort(compareAlerts);
      renderRows(sortedAlerts);
      updateSortIndicators();
      updateSummary(sortedAlerts);
    }

    function updateSummary(alerts) {
      const totalWindows = alerts.reduce((sum, alert) => {
        return sum + (Array.isArray(alert.windows) ? alert.windows.length : 0);
      }, 0);
      const uniquePeriods = new Set(alerts.map((alert) => alert.periodTs)).size;
      const uniqueEventIDs = new Set(alerts.map((alert) => alert.nativeEventID)).size;

      chipAlertCount.textContent = String(alerts.length);
      chipWindowCount.textContent = String(totalWindows);
      chipPeriodCount.textContent = String(uniquePeriods);
      chipEventCount.textContent = String(uniqueEventIDs);
      summaryRow.hidden = alerts.length === 0;
    }

    function setSort(key) {
      if (sortState.key === key) {
        sortState.direction = sortState.direction === "asc" ? "desc" : "asc";
      } else {
        sortState.key = key;
        sortState.direction = key === "tsBegin" ? "asc" : "desc";
      }

      sortAndRenderAlerts();
    }

    for (const header of sortableHeaders) {
      const button = header.querySelector("button");
      if (!button) {
        continue;
      }

      button.addEventListener("click", function () {
        setSort(header.dataset.sortKey);
      });
    }

    const timestampFormatter = new Intl.DateTimeFormat(undefined, {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      fractionalSecondDigits: 3,
      hour12: false,
    });

    function formatTimestamp(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) {
        return value;
      }

      const date = new Date(number);
      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return timestampFormatter.format(date);
    }

    function formatPeriod(value) {
      const number = Number(value);
      if (!Number.isFinite(number) || number < 0) {
        return value;
      }

      const units = [
        { label: "day", ms: 24 * 60 * 60 * 1000 },
        { label: "hour", ms: 60 * 60 * 1000 },
        { label: "minute", ms: 60 * 1000 },
        { label: "second", ms: 1000 },
      ];

      for (const unit of units) {
        if (number >= unit.ms) {
          const scaled = number / unit.ms;
          let rounded;
          if (unit.label === "second") {
            const roundedHalfSecond = Math.round(scaled * 2) / 2;
            rounded = Number.isInteger(roundedHalfSecond)
              ? roundedHalfSecond.toFixed(0)
              : roundedHalfSecond.toFixed(1);
          } else {
            rounded = scaled >= 10 ? scaled.toFixed(0) : scaled.toFixed(1);
          }
          const suffix = Number(rounded) === 1 ? unit.label : unit.label + "s";
          return rounded + " " + suffix;
        }
      }

      return Math.round(number).toLocaleString() + " ms";
    }

    function periodIcon() {
      return "<span class='window-icon' aria-hidden='true'><svg viewBox='0 0 24 24'><path d='M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 5v5.2l4 2.4-1 1.7-5-3V7z'/></svg></span>";
    }

    function confidenceIcon() {
      return "<span class='window-icon' aria-hidden='true'><svg viewBox='0 0 24 24'><path d='M12 2 3 7v10l9 5 9-5V7l-9-5zm0 3 6 3.3V15l-6 3.3L6 15V8.3L12 5z'/></svg></span>";
    }

    function formatConfidence(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) {
        return value;
      }

      return Math.max(0, Math.min(100, Math.round(number))) + "%";
    }

    function formatWindowCount(count) {
      return count === 1 ? "1 window" : count + " windows";
    }

    function renderWindowCards(windows) {
      if (!windows.length) {
        return "-";
      }

      return "<details><summary><span class='summary-row'><span class='window-pill'>" +
        windows.length +
        "</span><span class='summary-hint'>" +
        formatWindowCount(windows.length) +
        "</span><span class='summary-chevron'>▸</span></span></summary><div class='window-list'>" +
        windows.map(function (windowAlert, index) {
          const windowLabel = "Window " + (index + 1);
          return "<div class='window-card'>" +
            "<div class='window-card-header'>" +
              "<div class='window-card-title'>" + windowLabel + "</div>" +
              "<div class='window-card-meta'>Confidence " + formatConfidence(windowAlert.confidence) + "</div>" +
            "</div>" +
            "<div class='window-card-body'>" +
              "<span class='time-range'>" + formatTimestamp(windowAlert.tsBegin) + " → " + formatTimestamp(windowAlert.tsEnd) + "</span>" +
            "</div>" +
          "</div>";
        }).join("") +
        "</div></details>";
    }

    function renderRows(alerts) {
      tbody.innerHTML = "";
      for (const alert of alerts) {
        const tr = document.createElement("tr");
        const windows = Array.isArray(alert.windows) ? alert.windows : [];
        const windowsHtml = renderWindowCards(windows);
        tr.innerHTML =
          "<td>" + alert.alertID + "</td>" +
          "<td>" + (alert.nativeEventID ?? "-") + "</td>" +
          "<td>" + alert.endpointID + "</td>" +
          "<td>" + formatTimestamp(alert.tsBegin) + "</td>" +
          "<td>" + formatTimestamp(alert.tsEnd) + "</td>" +
          "<td><span class='period-badge'>" + periodIcon() + formatPeriod(alert.periodTs) + "</span></td>" +
          "<td><span class='confidence-badge'>" + confidenceIcon() + formatConfidence(alert.confidence) + "</span></td>" +
          "<td>" + windowsHtml + "</td>";
        tbody.appendChild(tr);
      }
      table.hidden = alerts.length === 0;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      const endpointID = endpointInput.value.trim();
      if (!endpointID) {
        return;
      }

      statusEl.textContent = "Loading...";
      table.hidden = true;
      tbody.innerHTML = "";

      try {
        const response = await fetch("/api/alerts?endpointID=" + encodeURIComponent(endpointID));
        const data = await response.json();

        if (!response.ok) {
          statusEl.textContent = data.error || "Failed to load alerts";
          summaryRow.hidden = true;
          return;
        }

        statusEl.textContent = "Found " + data.count + " alert(s)";
        currentAlerts = Array.isArray(data.alerts) ? data.alerts : [];
        sortAndRenderAlerts();
      } catch (error) {
        statusEl.textContent = "Network error";
      }
    });
  </script>
</body>
</html>
