<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RayleighTown Alerts Viewer (POC)</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* CSS Variables for a cohesive, elegant palette */
    :root {
      --primary: #7b61ff; 
      --primary-hover: #6a4dfc;
      --bg-gradient: linear-gradient(135deg, #f3f5f9 0%, #e8ecf3 100%);
      --surface: #ffffff;
      --text-main: #334155;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    body { 
      font-family: 'Inter', sans-serif; 
      margin: 0; 
      padding: 40px 20px;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* The main "Card" to provide depth */
    .container {
      background: var(--surface);
      width: 100%;
      max-width: 850px;
      padding: 32px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
      height: fit-content;
    }

    h2 {
      margin-top: 0;
      color: var(--text-main);
      font-weight: 600;
      font-size: 1.5rem;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    form { 
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px; 
    }

    label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(123, 97, 255, 0.15);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(123, 97, 255, 0.2);
    }

    button:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 8px -2px rgba(123, 97, 255, 0.25);
    }

    button:active {
      transform: translateY(0);
    }

    #status {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      min-height: 20px;
    }

    table { 
      border-collapse: collapse; 
      width: 100%; 
      font-size: 0.95rem;
    }

    th, td { 
      padding: 14px 16px; 
      text-align: left; 
      border-bottom: 1px solid var(--border); 
    }

    th { 
      background: #f8fafc; 
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    th.sortable {
      padding: 0;
    }

    th.sortable button {
      width: 100%;
      padding: 14px 16px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 600;
      text-transform: inherit;
      letter-spacing: inherit;
      cursor: pointer;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    th.sortable button:hover {
      background: rgba(123, 97, 255, 0.08);
      transform: none;
      box-shadow: none;
    }

    .sort-indicator {
      font-size: 0.75rem;
      color: var(--primary);
      min-width: 1em;
      text-align: right;
    }

    /* Rounding the top corners of the table header */
    th:first-child { border-top-left-radius: 8px; }
    th:last-child { border-top-right-radius: 8px; }

    /* Subtle hover state for table rows */
    tbody tr {
      transition: background-color 0.15s ease;
    }
    
    tbody tr:hover {
      background-color: #f8fafc;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>RayleighTown Alerts Viewer</h2>

    <form id="queryForm">
      <label>
        Endpoint ID:
        <input id="endpointID" value="123" placeholder="e.g. 123" required />
      </label>
      <button type="submit">Load Alerts</button>
    </form>

    <div id="status"></div>

    <table id="alertsTable" hidden>
      <thead>
        <tr>
          <th class="sortable" data-sort-key="alertID"><button type="button">Alert ID <span class="sort-indicator"></span></button></th>
          <th class="sortable" data-sort-key="nativeEventID"><button type="button">Event ID <span class="sort-indicator"></span></button></th>
          <th class="sortable" data-sort-key="endpointID"><button type="button">Endpoint <span class="sort-indicator"></span></button></th>
          <th class="sortable" data-sort-key="tsBegin"><button type="button">Start Time <span class="sort-indicator"></span></button></th>
          <th class="sortable" data-sort-key="tsEnd"><button type="button">End Time <span class="sort-indicator"></span></button></th>
          <th class="sortable" data-sort-key="periodTs"><button type="button">Period <span class="sort-indicator"></span></button></th>
          <th class="sortable" data-sort-key="confidence"><button type="button">Confidence <span class="sort-indicator"></span></button></th>
          <th>Windows</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById("queryForm");
    const endpointInput = document.getElementById("endpointID");
    const statusEl = document.getElementById("status");
    const table = document.getElementById("alertsTable");
    const tbody = table.querySelector("tbody");
    const sortableHeaders = Array.from(table.querySelectorAll("th.sortable"));

    let currentAlerts = [];
    let sortState = {
      key: "tsBegin",
      direction: "asc",
    };

    function getSortValue(alert, key) {
      const value = alert[key];
      if (value === null || value === undefined || value === "") {
        return key === "nativeEventID" ? Number.MAX_SAFE_INTEGER : "";
      }

      if (key === "endpointID") {
        return String(value).toLowerCase();
      }

      const number = Number(value);
      if (Number.isFinite(number)) {
        return number;
      }

      return String(value).toLowerCase();
    }

    function compareAlerts(left, right) {
      const leftValue = getSortValue(left, sortState.key);
      const rightValue = getSortValue(right, sortState.key);

      if (leftValue < rightValue) {
        return sortState.direction === "asc" ? -1 : 1;
      }

      if (leftValue > rightValue) {
        return sortState.direction === "asc" ? 1 : -1;
      }

      return 0;
    }

    function updateSortIndicators() {
      for (const header of sortableHeaders) {
        const indicator = header.querySelector(".sort-indicator");
        const key = header.dataset.sortKey;
        if (!indicator) {
          continue;
        }

        if (key === sortState.key) {
          indicator.textContent = sortState.direction === "asc" ? "▲" : "▼";
        } else {
          indicator.textContent = "";
        }
      }
    }

    function sortAndRenderAlerts() {
      const sortedAlerts = [...currentAlerts].sort(compareAlerts);
      renderRows(sortedAlerts);
      updateSortIndicators();
    }

    function setSort(key) {
      if (sortState.key === key) {
        sortState.direction = sortState.direction === "asc" ? "desc" : "asc";
      } else {
        sortState.key = key;
        sortState.direction = key === "tsBegin" ? "asc" : "desc";
      }

      sortAndRenderAlerts();
    }

    for (const header of sortableHeaders) {
      const button = header.querySelector("button");
      if (!button) {
        continue;
      }

      button.addEventListener("click", function () {
        setSort(header.dataset.sortKey);
      });
    }

    const timestampFormatter = new Intl.DateTimeFormat(undefined, {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      fractionalSecondDigits: 3,
      hour12: false,
    });

    function formatTimestamp(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) {
        return value;
      }

      const date = new Date(number);
      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return timestampFormatter.format(date);
    }

    function formatPeriod(value) {
      const number = Number(value);
      if (!Number.isFinite(number) || number < 0) {
        return value;
      }

      const units = [
        { label: "day", ms: 24 * 60 * 60 * 1000 },
        { label: "hour", ms: 60 * 60 * 1000 },
        { label: "minute", ms: 60 * 1000 },
        { label: "second", ms: 1000 },
      ];

      for (const unit of units) {
        if (number >= unit.ms) {
          const scaled = number / unit.ms;
          let rounded;
          if (unit.label === "second") {
            const roundedHalfSecond = Math.round(scaled * 2) / 2;
            rounded = Number.isInteger(roundedHalfSecond)
              ? roundedHalfSecond.toFixed(0)
              : roundedHalfSecond.toFixed(1);
          } else {
            rounded = scaled >= 10 ? scaled.toFixed(0) : scaled.toFixed(1);
          }
          const suffix = Number(rounded) === 1 ? unit.label : unit.label + "s";
          return rounded + " " + suffix;
        }
      }

      return Math.round(number).toLocaleString() + " ms";
    }

    function renderRows(alerts) {
      tbody.innerHTML = "";
      for (const alert of alerts) {
        const tr = document.createElement("tr");
        const windows = Array.isArray(alert.windows) ? alert.windows : [];
        const windowsHtml = windows.length === 0
          ? "-"
          : "<details><summary>" + windows.length + " window(s)</summary><ul style='margin: 8px 0 0 18px; padding: 0;'>" +
            windows.map(function (windowAlert) {
              return "<li>" + formatTimestamp(windowAlert.tsBegin) + " - " + formatTimestamp(windowAlert.tsEnd) + "</li>";
            }).join("") +
            "</ul></details>";
        tr.innerHTML =
          "<td>" + alert.alertID + "</td>" +
          "<td>" + (alert.nativeEventID ?? "-") + "</td>" +
          "<td>" + alert.endpointID + "</td>" +
          "<td>" + formatTimestamp(alert.tsBegin) + "</td>" +
          "<td>" + formatTimestamp(alert.tsEnd) + "</td>" +
          "<td>" + formatPeriod(alert.periodTs) + "</td>" +
          "<td>" + alert.confidence + "</td>" +
          "<td>" + windowsHtml + "</td>";
        tbody.appendChild(tr);
      }
      table.hidden = alerts.length === 0;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      const endpointID = endpointInput.value.trim();
      if (!endpointID) {
        return;
      }

      statusEl.textContent = "Loading...";
      table.hidden = true;
      tbody.innerHTML = "";

      try {
        const response = await fetch("/api/alerts?endpointID=" + encodeURIComponent(endpointID));
        const data = await response.json();

        if (!response.ok) {
          statusEl.textContent = data.error || "Failed to load alerts";
          return;
        }

        statusEl.textContent = "Found " + data.count + " alert(s)";
        currentAlerts = Array.isArray(data.alerts) ? data.alerts : [];
        sortAndRenderAlerts();
      } catch (error) {
        statusEl.textContent = "Network error";
      }
    });
  </script>
</body>
</html>
