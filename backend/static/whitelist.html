<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RayleighTown Whitelist</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="whitelist">

  <div class="container">
    <div class="header">
      <div class="title-block">
        <div class="title-line">
          <span class="title-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2 3 6v6c0 5 3.4 9.7 9 10 5.6-.3 9-5 9-10V6l-9-4zm0 3.2 5 2.2V12c0 3.8-2.3 7.2-5 7.9-2.7-.7-5-4.1-5-7.9V7.4l5-2.2z"/></svg>
          </span>
          <h2>RayleighTown Whitelist</h2>
        </div>
        <p class="subtitle">Hide expected patterns from the alert UI.</p>
      </div>

      <div class="header-tools">
        <nav class="page-nav" aria-label="Main navigation">
          <a class="nav-link" href="/">Dashboard</a>
          <a class="nav-link" href="/alerts">Alerts</a>
        </nav>
      </div>
    </div>

    <div class="summary-row">
      <div class="chip"><span>Patterns</span> <strong id="chipWhitelistCount">0</strong></div>
    </div>

    <div id="whitelistStatus" class="admin-status" role="alert"></div>

    <section class="widget admin-section whitelist-list-panel">
      <div class="widget-header whitelist-list-header">
        <div>
          <h3 class="widget-title">Current entries</h3>
          <p class="widget-subtitle">Or whitelist from an alert.</p>
        </div>
        <button type="button" id="openAddPattern" class="secondary-button">Add pattern</button>
      </div>

      <div id="addPatternPanel" class="whitelist-compose-panel" hidden>
        <div class="widget-header">
          <h3 class="widget-title">Add pattern</h3>
          <p class="widget-subtitle">Leave identity blank to mute the whole event type.</p>
        </div>

        <form id="addWhitelistForm" class="whitelist-compose">
          <div class="whitelist-compose-row">
            <label class="whitelist-field">
              <span class="whitelist-field-label">Note</span>
              <input id="addNote" type="text" required placeholder="e.g. Acme Updater" />
            </label>
            <label class="whitelist-field">
              <span class="whitelist-field-label">Event type</span>
              <select id="addEventType" required></select>
            </label>
          </div>

          <div class="whitelist-compose-block">
            <span class="whitelist-field-label">Series identity</span>
            <div id="addIdentityFields" class="whitelist-identity-grid"></div>
          </div>

          <div class="whitelist-options">
            <div class="whitelist-option">
              <label class="whitelist-check">
                <input type="checkbox" id="addLimitEndpoint" />
                <span>Limit to one endpoint</span>
              </label>
              <label class="whitelist-field whitelist-option-control" id="addEndpointWrap">
                <span class="whitelist-field-label">Endpoint</span>
                <select id="addEndpoint"></select>
              </label>
            </div>

            <div class="whitelist-option">
              <label class="whitelist-check">
                <input type="checkbox" id="addMatchPeriod" />
                <span>Limit to a specific period</span>
              </label>
              <label class="whitelist-field whitelist-option-control" id="addPeriodWrap">
                <span class="whitelist-field-label">Period (seconds)</span>
                <input id="addPeriodSeconds" type="number" min="1" step="1" placeholder="300" />
              </label>
            </div>
          </div>

          <div class="whitelist-compose-actions">
            <button type="button" id="cancelAddPattern" class="secondary-button">Cancel</button>
            <button type="submit">Add to whitelist</button>
          </div>
        </form>
      </div>

      <div class="table-shell whitelist-table-shell">
        <div class="table-scroll">
          <table id="whitelistTable">
            <colgroup>
              <col class="col-wl-note" />
              <col class="col-wl-event" />
              <col class="col-wl-scope" />
              <col class="col-wl-match" />
              <col class="col-wl-period" />
              <col class="col-wl-when" />
              <col class="col-wl-by" />
              <col class="col-wl-actions" />
            </colgroup>
            <thead>
              <tr>
                <th>Note</th>
                <th>Event</th>
                <th>Scope</th>
                <th>Match</th>
                <th>Period</th>
                <th>When</th>
                <th>By</th>
                <th class="admin-actions-col">Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <p id="whitelistEmpty" class="detail-empty" hidden>No whitelist entries yet.</p>
    </section>
  </div>

  <script src="auth.js"></script>
  <script src="relative_time.js"></script>
  <script src="whitelist.js"></script>
</body>
</html>
